# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.12.0/tools/projmgr/schemas/csolution.schema.json
solution:
  created-for: CMSIS-Toolbox@2.12.0
  cdefault:

  # List of tested compilers that can be selected
  select-compiler:
    - compiler: GCC

  # Select used compiler
  compiler: GCC

  packs:
    - pack: AlifSemiconductor::Ensemble@2.2.1
    - pack: ARM::CMSIS-Compiler@^2.0.0
    - pack: ARM::CMSIS@^6.0.0

  variables:
    - DeviceLayer: $SolutionDir()$/device/device.clayer.yml
    - DriverLayer: $SolutionDir()$/libs/soc/soc.clayer.yml

  target-types:
    - type: E7-HE
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HE
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HE"
        - "M55_HE"
      target-set:
        - set:
          images:
            - project-context: app_he.release

    - type: E7-HP
      device: Alif Semiconductor::AE722F80F55D5LS:M55_HP
      board: Alif Semiconductor::DevKit-E7
      define:
        - "CORE_M55_HP"
        - "M55_HP"
      target-set:
        - set:
          images:
            - project-context: app_hp.release

    - type: E1C-HE
      device: Alif Semiconductor::AE1C1F4051920PH0:M55_HE
      board: Alif Semiconductor::DevKit-E1C
      define:
        - "ENSEMBLE_SOC_E1C"
        - "CORE_M55_HE"
        - "M55_HE_E1C"
        - "M55_HE"
      target-set:
        - set:
          images:
            - project-context: app_he.release

    - type: E8-HE
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HE
      board: Alif Semiconductor::DevKit-E8
      define:
        - "ENSEMBLE_SOC_GEN2"
        - "CORE_M55_HE"
        - "M55_HE"
      target-set:
        - set:
          images:
            - project-context: app_he.release

    - type: E8-HP
      device: Alif Semiconductor::AE822FA0E5597LS0:M55_HP
      board: Alif Semiconductor::DevKit-E8
      define:
        - "ENSEMBLE_SOC_GEN2"
        - "CORE_M55_HP"
        - "M55_HP"
      target-set:
        - set:
          images:
            - project-context: app_hp.release

  build-types:
    - type: debug
      optimize: debug
      debug: on
      define:
        - _DEBUG
    - type: release
      optimize: speed
      debug: on

  define:
    - UNICODE
    - _UNICODE

  projects:
    - project: app_he/app_he.cproject.yml
      for-context:
        - +E1C-HE
        - +E7-HE
        - +E8-HE
    - project: app_hp/app_hp.cproject.yml
      for-context:
        - +E7-HP
        - +E8-HP
